name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: pages
        uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Тесты
        run: bun run test
      - name: Статическая сборка
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Постоянный адрес (origin без подпапки) — для canonical, sitemap и og:image.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || steps.pages.outputs.origin }}
        run: bun run build
      - name: Страница 404
        run: cp .output/public/index.html .output/public/404.html
      - name: Проверка: страницы отрендерены статически
        run: |
          count=$(find .output/public -name index.html | wc -l)
          echo "HTML-страниц: $count"
          test "$count" -ge 100
          test -f .output/public/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
